<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="388" viewBox="0 0 1000 388" role="img" aria-labelledby="t d"><title id="t">Journey return performance</title><desc id="d">Longest RAF interval during Journey return: tablet 416.7 ms before versus 16.8 ms after; phone 283.3 ms before versus 16.8 ms after. Emulated viewports.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d17"/><stop offset="1" stop-color="#141b2e"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="0.5" y="0.5" width="999" height="387" rx="18" fill="url(#bg)" stroke="#28344b"/><path d="M24 24h16l-8 14H16zM43 24h7l-8 14h-7z" fill="#ff4261"/><text x="62" y="38" font-size="21" font-weight="700" fill="#f4f7ff" text-anchor="start">AZENO HI  /  TRANSITION FRAME INTERVALS</text><text x="24" y="67" font-size="13" font-weight="400" fill="#a9b7ce" text-anchor="start">Longest observed requestAnimationFrame interval during the return from Journey · lower is better</text><line x1="775" y1="31" x2="795" y2="31" stroke="#ff4261" stroke-width="3"/><text x="803" y="36" font-size="13" font-weight="400" fill="#a9b7ce" text-anchor="start">Before</text><line x1="877" y1="31" x2="897" y2="31" stroke="#55c9ef" stroke-width="3"/><text x="905" y="36" font-size="13" font-weight="400" fill="#a9b7ce" text-anchor="start">After</text><line x1="245.0" y1="101" x2="245.0" y2="277" stroke="#27334a" stroke-width="1"/><text x="245.0" y="296" font-size="12" font-weight="400" fill="#a9b7ce" text-anchor="middle">0</text><line x1="397.8888888888889" y1="101" x2="397.8888888888889" y2="277" stroke="#27334a" stroke-width="1"/><text x="397.8888888888889" y="296" font-size="12" font-weight="400" fill="#a9b7ce" text-anchor="middle">100</text><line x1="550.7777777777778" y1="101" x2="550.7777777777778" y2="277" stroke="#27334a" stroke-width="1"/><text x="550.7777777777778" y="296" font-size="12" font-weight="400" fill="#a9b7ce" text-anchor="middle">200</text><line x1="703.6666666666667" y1="101" x2="703.6666666666667" y2="277" stroke="#27334a" stroke-width="1"/><text x="703.6666666666667" y="296" font-size="12" font-weight="400" fill="#a9b7ce" text-anchor="middle">300</text><line x1="856.5555555555555" y1="101" x2="856.5555555555555" y2="277" stroke="#27334a" stroke-width="1"/><text x="856.5555555555555" y="296" font-size="12" font-weight="400" fill="#a9b7ce" text-anchor="middle">400</text><text x="25" y="126" font-size="15" font-weight="600" fill="#f4f7ff" text-anchor="start">768 × 1024 · DPR 1</text><text x="25" y="149" font-size="12" font-weight="400" fill="#a9b7ce" text-anchor="start">Before / after</text><rect x="245" y="108" width="637.088" height="20" rx="4" fill="#ff4261" stroke="#ff4261"/><text x="891.088" y="123" font-size="13" font-weight="600" fill="#f4f7ff" text-anchor="start">416.7 ms</text><rect x="245" y="138" width="25.685333333333336" height="20" rx="4" fill="#55c9ef" stroke="#55c9ef"/><text x="279.68533333333335" y="153" font-size="13" font-weight="600" fill="#f4f7ff" text-anchor="start">16.8 ms</text><text x="25" y="212" font-size="15" font-weight="600" fill="#f4f7ff" text-anchor="start">390 × 844 · DPR 2</text><text x="25" y="235" font-size="12" font-weight="400" fill="#a9b7ce" text-anchor="start">Before / after</text><rect x="245" y="194" width="433.1342222222222" height="20" rx="4" fill="#ff4261" stroke="#ff4261"/><text x="687.1342222222222" y="209" font-size="13" font-weight="600" fill="#f4f7ff" text-anchor="start">283.3 ms</text><rect x="245" y="224" width="25.685333333333336" height="20" rx="4" fill="#55c9ef" stroke="#55c9ef"/><text x="279.68533333333335" y="239" font-size="13" font-weight="600" fill="#f4f7ff" text-anchor="start">16.8 ms</text><text x="589.0" y="315" font-size="12" font-weight="400" fill="#a9b7ce" text-anchor="middle">Frame interval (ms)</text><text x="25" y="344" font-size="13" font-weight="400" fill="#a9b7ce" text-anchor="start">Emulated tablet and phone viewports on the M3 Pro; not a physical mobile-device benchmark.</text><text x="25" y="364" font-size="13" font-weight="400" fill="#a9b7ce" text-anchor="start">The separate 299.9 ms catalogue outlier remains unresolved; three isolated repeats measured 16.8 ms.</text></g></svg>